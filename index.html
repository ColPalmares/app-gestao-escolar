<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Gestão Escolar - Colégio Palmares</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="logo-palmares.png" alt="Colégio Palmares">
    </div>

    <!-- TELA DE LOGIN -->
    <div id="tela-login">
        <h2>Acesso de Funcionários</h2>
        <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 25px;">Utilize sua conta institucional</p>
        <div id="buttonDiv" style="display: flex; justify-content: center;"></div>
    </div>

    <!-- TELA DO MENU PRINCIPAL -->
    <div id="tela-menu" class="hidden">
        <h2>Portal de Gestão Escolar</h2>
        <p id="msg-bem-vindo" style="color: #666; font-size: 14px; text-align: center; font-weight: bold; margin-bottom: 20px;"></p>
        <div id="carregando-permissoes" class="loading">Verificando permissões de acesso...</div>
        
        <div id="lista-modulos" class="hidden">
            <p style="font-size: 14px; color: #444; margin-bottom: 15px;">Selecione o módulo desejado:</p>
            <button id="btn-mod-saida" class="menu-btn hidden" onclick="abrirMenuSaida()">Autorização de Saída</button>
            <button id="btn-mod-frequencia" class="menu-btn hidden" onclick="abrirMenuFrequencia()">Controle de Frequência / Faltas</button>
            <button id="btn-mod-ocorrencias" class="menu-btn hidden" onclick="abrirMenuOcorrencias()">Registro de Ocorrências</button>
            <button id="btn-mod-notas" class="menu-btn hidden" onclick="abrirMenuNotas()">Módulo de Notas & Boletins</button>
        </div>
    </div>

    <!-- SUBMENUS -->
    <div id="submenu-saida" class="hidden">
        <h2>Autorização de Saída</h2>
        <button class="sub-menu-btn" onclick="abrirFormularioSaida()">➕ Nova Autorização</button>
        <button class="sub-menu-btn" style="background-color: #FFC27D; color: #000;" onclick="abrirTelaConsultaSaida()">📋 Consultar Autorizações</button>
        <button class="voltar-btn" onclick="voltarAoMenuPrincipal()">Voltar ao Menu Principal</button>
    </div>
    <div id="submenu-frequencia" class="hidden">
        <h2>Controle de Frequência</h2>
        <button class="sub-menu-btn" onclick="abrirFormularioFrequencia()">➕ Registrar Frequência</button>
        <button class="sub-menu-btn" style="background-color: #FFC27D; color: #000;" onclick="abrirTelaConsultaFrequencia()">📋 Consultar Frequências</button>
        <button class="voltar-btn" onclick="voltarAoMenuPrincipal()">Voltar ao Menu Principal</button>
    </div>
    <div id="submenu-ocorrencias" class="hidden">
        <h2>Registro de Ocorrências</h2>
        <button class="sub-menu-btn" onclick="abrirFormularioOcorrencia()">➕ Nova Ocorrência</button>
        <button class="sub-menu-btn" style="background-color: #FFC27D; color: #000;" onclick="abrirTelaConsultaOcorrencia()">📋 Consultar Ocorrências</button>
        <button class="voltar-btn" onclick="voltarAoMenuPrincipal()">Voltar ao Menu Principal</button>
    </div>
    <div id="submenu-notas" class="hidden">
        <h2>Módulo de Notas</h2>
        <button class="sub-menu-btn" onclick="abrirFormularioNotas()">✏️ Lançamento de Notas por Atividade</button>
        <button class="sub-menu-btn" style="background-color: #FFC27D; color: #000;" onclick="abrirTelaFiltroMatrizAnalitica()">📋 Matriz Analítica por Atividade</button>
        <button class="sub-menu-btn" style="background-color: #008080; color: #fff;" onclick="abrirTelaFiltroBoletimAluno()">👤 Boletim Individual do Aluno</button>
        <button class="sub-menu-btn" style="background-color: #4682B4; color: #fff;" onclick="abrirTelaFiltroBoletimTurma()">👥 Boletim Consolidado da Turma</button>
        <button class="voltar-btn" onclick="voltarAoMenuPrincipal()">Voltar ao Menu Principal</button>
    </div>

    <!-- INCLUSÃO DAS TELAS DOS MÓDULOS (SAÍDA, FREQ, OCORRÊNCIAS, NOTAS) -->
    <!-- (Aqui entram as divs completas de formulários e tabelas de consulta de cada arquivo correspondente) -->

</div>

<!-- CARREGAMENTO DOS MÓDULOS JS SEPARADOS -->
<script src="js/app.js"></script>
<script src="js/saidas.js"></script>
<script src="js/frequencia.js"></script>
<script src="js/ocorrencias.js"></script>
<script src="js/notas.js"></script>
</body>
</html>
